name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate app icon (light blue)
        run: |
          pip install pillow
          RES="src/main/res"
          mkdir -p "$RES"
          echo "build.gradle:"; ls *.gradle* 2>/dev/null; grep -n "res\|srcDir\|manifest" build.gradle 2>/dev/null | head -20
          cat > /tmp/gen_icons.py <<'PYEOF'
          import os, sys
          from PIL import Image, ImageDraw
          res = sys.argv[1]
          S = 1024
          im = Image.new("RGB", (S, S)); px = im.load()
          top, bot = (166, 224, 255), (56, 170, 240)
          for y in range(S):
              t = y / (S - 1)
              c = tuple(int(top[i] + (bot[i] - top[i]) * t) for i in range(3))
              for x in range(S): px[x, y] = c
          d = ImageDraw.Draw(im, "RGBA")
          d.rounded_rectangle((170, 250, 854, 690), 70, fill=(255, 255, 255, 255))
          d.rounded_rectangle((220, 300, 804, 640), 40, fill=(21, 101, 192, 255))
          d.rounded_rectangle((440, 690, 584, 760), 20, fill=(255, 255, 255, 255))
          d.rounded_rectangle((330, 750, 694, 800), 25, fill=(255, 255, 255, 255))
          d.polygon([(470, 400), (470, 540), (590, 470)], fill=(255, 255, 255, 255))
          for r, a in ((80, 255), (130, 200)):
              d.arc((640 - r, 470 - r, 640 + r, 470 + r), -50, 50, fill=(255, 255, 255, a), width=16)
          for k, v in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              dd = f"{res}/mipmap-{k}"; os.makedirs(dd, exist_ok=True)
              sq = im.resize((v, v), Image.LANCZOS)
              for name, shape in (("ic_launcher", "rr"), ("ic_launcher_round", "o")):
                  m = Image.new("L", (v * 4, v * 4), 0); md = ImageDraw.Draw(m)
                  if shape == "rr": md.rounded_rectangle((0, 0, v * 4 - 1, v * 4 - 1), int(v * 0.22) * 4, fill=255)
                  else: md.ellipse((0, 0, v * 4 - 1, v * 4 - 1), fill=255)
                  a = sq.convert("RGBA"); a.putalpha(m.resize((v, v), Image.LANCZOS)); a.save(f"{dd}/{name}.png")
          os.makedirs(f"{res}/drawable-xhdpi", exist_ok=True)
          bn = Image.new("RGB", (640, 360), (80, 178, 242)); bn.paste(im.resize((300, 300), Image.LANCZOS), (170, 30))
          bn.save(f"{res}/drawable-xhdpi/banner.png")

          PYEOF
          python3 /tmp/gen_icons.py "$RES"
          ls -R "$RES" | head -30
      - name: Sync updated Java files to the real source folder
        run: |
          if [ -d app/src/main/java/com/tvlink/app ]; then
            for f in app/src/main/java/com/tvlink/app/*.java; do
              n=$(basename "$f")
              t=$(find . -name "$n" -not -path "./app/*" -not -path "*/build/*" | head -1)
              if [ -n "$t" ]; then cp "$f" "$t"; echo "updated $t"; else echo "no target for $n"; fi
            done
          fi
      - run: gradle assembleDebug --no-daemon
      - run: find /tmp/tvlink-build -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TVLink-apk
          path: /tmp/tvlink-build/**/*.apk
          if-no-files-found: error
