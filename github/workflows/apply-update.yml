name: Apply update
on:
  push:
    paths:
      - 'TVLink_ready.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip over the project
        run: |
          unzip -o TVLink_ready.zip -d .
          rm -f TVLink_ready.zip
      - name: Commit
        run: |
          git config user.name "update-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply TVLink update" || echo "nothing to commit"
          git push
